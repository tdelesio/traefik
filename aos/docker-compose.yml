version: '3.8'

services:
  # ==========================================================================
  # ⚔️ WARHAMMER LIST BUILDER & GAME TRACKER SERVICES
  # ==========================================================================
  warhammer_db:
    image: postgres:16-alpine
    container_name: warhammer_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warhammer_list_builder
    # Exposed host port kept in case you want to connect client apps (e.g. pgAdmin, TablePlus) on host
    ports:
      - "5439:5432"
    volumes:
      - warhammer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aos-internal

  warhammer_web:
    build:
      context: ./warhammer_list_builder   # Points cleanly to the subfolder
      dockerfile: Dockerfile
    container_name: warhammer_web
    restart: always
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgres@warhammer_db:5432/warhammer_list_builder
      - NODE_ENV=production
    volumes:
      - ./warhammer_list_builder:/app     # Hot-reloading syncs directly inside subfolder
      - /app/node_modules
    command: npm run dev
    depends_on:
      warhammer_db:
        condition: service_healthy
    # 🏷️ Traefik Labels: Instructs Traefik on how to route incoming HTTPS traffic
    labels:
      - "traefik.enable=true"
      # Change "warhammer.localhost" to whatever local/production domain you want to match
      - "traefik.http.routers.warhammer.rule=Host(`warhammer.${DOMAINNAME:-delesio.com}`)"
      - "traefik.http.routers.warhammer.entrypoints=websecure"
      - "traefik.http.routers.warhammer.tls=true"
      - "traefik.http.routers.warhammer.tls.certresolver=myresolver"
      - "traefik.http.routers.warhammer.middlewares=secure-headers@docker"
      - "traefik.http.services.warhammer.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik_proxy"
    networks:
      - aos-internal
      - traefik_proxy

# Shared Volume and Network configs
volumes:
  warhammer_pgdata:

networks:
  # Private network for secure web-to-database communication
  aos-internal:
    driver: bridge
  # External network used by your central Traefik container
  traefik_proxy:
    external: true
