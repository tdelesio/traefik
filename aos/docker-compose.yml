version: '3.8'

services:
  # ==========================================================================
  # 🚦 TRAEFIK REVERSE PROXY SERVICE
  # ==========================================================================
  traefik:
    image: traefik:v3.0
    container_name: traefik_proxy
    restart: always
    command:
      - "--api.insecure=true"            # Enables Traefik Dashboard (port 8080)
      - "--providers.docker=true"         # Tells Traefik to look for Docker containers
      - "--providers.docker.exposedbydefault=false" # Only route containers with traefik.enable=true
      - "--entrypoints.web.address=:80"   # Create HTTP entrypoint on Port 80
    ports:
      - "80:80"                           # Standard Web Traffic
      - "8080:8080"                       # Traefik Dashboard UI
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Allows Traefik to read Docker container events
    networks:
      - traefik_net

  # ==========================================================================
  # ⚔️ WARHAMMER LIST BUILDER & GAME TRACKER SERVICES
  # ==========================================================================
  warhammer_db:
    image: postgres:16-alpine
    container_name: warhammer_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warhammer_list_builder
    # Exposed host port kept in case you want to connect client apps (e.g. pgAdmin, TablePlus) on host
    ports:
      - "5439:5432"
    volumes:
      - warhammer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - traefik_net

  warhammer_web:
    build:
      context: ./warhammer_list_builder   # Points cleanly to the subfolder
      dockerfile: Dockerfile
    container_name: warhammer_web
    restart: always
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgres@warhammer_db:5432/warhammer_list_builder
      - NODE_ENV=development
    volumes:
      - ./warhammer_list_builder:/app     # Hot-reloading syncs directly inside subfolder
      - /app/node_modules
    command: npm run dev
    depends_on:
      warhammer_db:
        condition: service_healthy
    # 🏷️ Traefik Labels: Instructs Traefik on how to route incoming HTTP traffic
    labels:
      - "traefik.enable=true"
      # Change "warhammer.localhost" to whatever local/production domain you want to match
      - "traefik.http.routers.warhammer.rule=Host(`warhammer.localhost`)"
      - "traefik.http.routers.warhammer.entrypoints=web"
      - "traefik.http.services.warhammer.loadbalancer.server.port=8080"
    networks:
      - traefik_net

  # ==========================================================================
  # 👥 ADD YOUR OTHER PROJECTS HERE!
  # ==========================================================================
  # other_project_web:
  #   build: ./other_project_folder
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.other.rule=Host(`other-project.localhost`)"
  #     - "traefik.http.services.other.loadbalancer.server.port=3000"
  #   networks:
  #     - traefik_net

# Shared Volume and Network configs
volumes:
  warhammer_pgdata:

networks:
  traefik_net:
    name: traefik_net
