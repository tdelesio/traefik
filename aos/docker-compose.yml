version: '3.8'

services:
  # ==========================================================================
  # ⚔️ WARHAMMER LIST BUILDER & GAME TRACKER SERVICES
  # ==========================================================================
  warhammer_web:
    image: tdelesio/aos-list-builder:latest  # Pulls directly from Docker Hub
    container_name: warhammer_web
    restart: always
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgres@warhammer_db:5432/warhammer_list_builder
      - NODE_ENV=production                  # Set to production
    # Removed build block and local dev volume mounts (source files are embedded inside the image!)
    depends_on:
      warhammer_db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.warhammer.rule=Host(`warhammer.localhost`)"
      - "traefik.http.routers.warhammer.entrypoints=web"
      - "traefik.http.services.warhammer.loadbalancer.server.port=8080"
    networks:
      - traefik_net

# Shared Volume and Network configs
volumes:
  warhammer_pgdata:

networks:
  # Private network for secure web-to-database communication
  aos-internal:
    driver: bridge
  # External network used by your central Traefik container
  traefik_proxy:
    external: true
