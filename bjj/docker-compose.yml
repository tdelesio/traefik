version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bjj_playbook_db_prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: production_secure_db_pass
      POSTGRES_DB: bjj_playbook
    volumes:
      - bjj_pgdata_prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bjj_playbook"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bjj-internal

  api:
    image: tdelesio/bjj-playbook-api:latest
    container_name: bjj_playbook_backend_prod
    environment:
      - NODE_ENV=production
      - PORT=5000
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=production_secure_db_pass
      - PGDATABASE=bjj_playbook
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - bjj-internal

  frontend:
    image: tdelesio/bjj-playbook-frontend:latest
    container_name: bjj_playbook_frontend_prod
    depends_on:
      - api
    restart: always
    networks:
      - bjj-internal
      - traefik_proxy # Connect to the external Traefik proxy network
    labels:
      - "traefik.enable=true"
      # Route all web traffic to the frontend
      - "traefik.http.routers.bjj-frontend.rule=Host(`bjj.${DOMAINNAME:-delesio.com}`)"
      - "traefik.http.routers.bjj-frontend.entrypoints=websecure"
      - "traefik.http.routers.bjj-frontend.tls=true"
      - "traefik.http.routers.bjj-frontend.tls.certresolver=myresolver"
      # Apply the shared security headers middleware defined in the root Traefik container
      - "traefik.http.routers.bjj-frontend.middlewares=secure-headers@docker"
      - "traefik.http.services.bjj-frontend.loadbalancer.server.port=80"
      # Ensure Traefik connects to this container via the shared proxy network
      - "traefik.docker.network=traefik_proxy"

volumes:
  bjj_pgdata_prod:

networks:
  # Internal bridge network for secure service-to-service and service-to-db communication
  bjj-internal:
    driver: bridge
  # External network used by Traefik
  traefik_proxy:
    external: true
