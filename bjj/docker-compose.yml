version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bjj-playbook-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bjj_playbook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: tdelesio/bjj-playbook-api:latest
    container_name: bjj-playbook-api
    restart: always
    depends_on:
      - db
    environment:
      - PORT=5000
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=bjj_playbook

  frontend:
    image: tdelesio/bjj-playbook-frontend:latest
    container_name: bjj-playbook-frontend
    ports:
      - "8080:80"
    restart: always
    depends_on:
      - api

volumes:
  postgres_data: