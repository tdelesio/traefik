version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: eartraining-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: eartraining
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dbpassword}
    volumes:
      - eartraining_mysql_data:/var/lib/mysql
    networks:
      - eartraining-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dbuser", "-pdbpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: tdelesio/eartraining:1.0.0
    container_name: eartraining-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: eartraining
      DB_USER: dbuser
      DB_PASSWORD: ${MYSQL_PASSWORD:-dbpassword}
      JWT_SECRET: ${JWT_SECRET:-cadence_production_jwt_secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eartraining-network
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eartraining.rule=Host(`eartraining.${DOMAINNAME:-delesio.com}`)"
      - "traefik.http.routers.eartraining.entrypoints=websecure"
      - "traefik.http.routers.eartraining.tls=true"
      - "traefik.http.routers.eartraining.tls.certresolver=myresolver"
      - "traefik.http.routers.eartraining.middlewares=secure-headers@docker"
      - "traefik.http.services.eartraining.loadbalancer.server.port=3001"
      - "traefik.docker.network=traefik_proxy"

volumes:
  eartraining_mysql_data:
    driver: local

networks:
  eartraining-network:
    driver: bridge
  traefik_proxy:
    external: true